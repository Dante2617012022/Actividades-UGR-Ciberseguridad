name: Academic publication guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: academic-publication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compile publication guard and tests
        run: python3 -m compileall -q scripts tests

      - name: Verify rejection and allowlist rules
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Review files introduced by this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_publication.py
